<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang-key="page_title_auto">Automatic Order</title>
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/Automatic-order.css">
    <link rel="stylesheet" href="../css/store.css">
    <link rel="stylesheet" href="../css/fonts.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<!-- ============== هدر ============== -->
<header class="header">
    <div class="header-container">

        <!-- بخش چپ: زبان با منوی کشویی -->
        <div class="header-left">
            <div class="language-wrapper">
                <button class="language-btn" id="languageToggle">
                    <span id="currentLanguage">🇬🇧 English</span>
                    <span class="language-arrow">▼</span>
                </button>
                
                <!-- منوی کشویی زبان -->
                <div class="language-dropdown" id="languageDropdown">
                    <ul class="language-list">
                        <li class="language-item" data-lang="en" onclick="changeLanguage('en', '🇬🇧', 'English')">
                            <span class="lang-flag">🇬🇧</span>
                            <span class="lang-name">English</span>
                        </li>
                        <li class="language-item" data-lang="fa" onclick="changeLanguage('fa', '🇮🇷', 'فارسی')">
                            <span class="lang-flag">🇮🇷</span>
                            <span class="lang-name">فارسی</span>
                        </li>
                        <li class="language-item" data-lang="ru" onclick="changeLanguage('ru', '🇷🇺', 'Русский')">
                            <span class="lang-flag">🇷🇺</span>
                            <span class="lang-name">Русский</span>
                        </li>
                        <li class="language-item" data-lang="zh" onclick="changeLanguage('zh', '🇨🇳', '中文')">
                            <span class="lang-flag">🇨🇳</span>
                            <span class="lang-name">中文</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- بخش وسط: دکمه پروفایل -->
        <div class="header-center">
            <div class="profile-wrapper">
                <button class="profile-btn" id="profileToggle">
                    <img src="https://ui-avatars.com/api/?name=User&background=6C63FF&color=fff&size=40" alt="Profile" />
                </button>
                
                <!-- منوی کشویی -->
                <div class="dropdown-menu" id="profileDropdown">
                    <div class="dropdown-header">
                        <img src="https://ui-avatars.com/api/?name=User&background=6C63FF&color=fff&size=50" alt="Profile" />
                        <div class="dropdown-user-info">
                            <span class="dropdown-username" data-lang-key="user_label">Dear User</span>
                            <span class="dropdown-email">user@example.com</span>
                        </div>
                    </div>
                    
                    <ul class="dropdown-list">
                        <a href="../html/User-information.html">
                            <li class="dropdown-item">
                                <img src="../assets/images/icons/1.png" alt="" class="img-icon">
                                <span class="dropdown-label" data-lang-key="user_info">User Information</span>
                            </li>
                        </a>
                        <a href="../html/shopping-cart.html">
                            <li class="dropdown-item">
                                <img src="../assets/images/icons/4.png" alt="" class="img-icon">
                                <span class="dropdown-label" data-lang-key="user_orders">User Orders</span>
                            </li>
                        </a>
                        <a href="../html/bonus.html">
                            <li class="dropdown-item">
                                <img src="../assets/images/icons/3.png" alt="" class="img-icon">
                                <span class="dropdown-label" data-lang-key="gifts_rewards">Gifts & Rewards</span>
                            </li>
                        </a>
                        <a href="#">
                            <li class="dropdown-divider"></li>
                        </a>
                        <a href="#">
                            <li class="dropdown-item logout" onclick="alert('Logging out')">
                                <span class="dropdown-icon">🚪</span>
                                <span class="dropdown-label" data-lang-key="logout">Logout</span>
                            </li>
                        </a>
                    </ul>
                </div>
            </div>
        </div>

        <!-- بخش راست: موجودی TON -->
        <a href="../html/TON.html">
            <div class="header-right">
                <div class="balance-box">
                    <span class="balance-currency">TON</span>
                    <span class="balance-amount">00</span>
                </div>
            </div>
        </a>

    </div>

    <!-- خط جداکننده زیر هدر -->
    <div class="header-divider"></div>
</header>

<!-- ===== باکس فیلترها ===== -->
<div class="filter-wrapper">
    <div class="filter-box">
        <button class="filter-btn active" data-filter="all" data-lang-key="filter_all">All</button>
        <button class="filter-btn" data-filter="flag" data-lang-key="filter_flag">Flag</button>
        <button class="filter-btn" data-filter="gifts" data-lang-key="filter_gift">Gifts</button>
        <button class="filter-btn" data-filter="special" data-lang-key="filter_special">Special</button>
        <button class="filter-btn" data-filter="other" data-lang-key="filter_other">Other</button>
    </div>
</div>

<!-- ===== محصولات ===== -->
<div class="products-grid" id="productsGrid">
    <!-- استیکرها به صورت داینامیک از دیتابیس بارگذاری می‌شوند -->
</div>

<!-- ===== دکمه ثابت پایین صفحه ===== -->
<a href="javascript:void(0)" class="cart-fixed-btn" id="cartFixedBtn" onclick="proceedToNextPage(event)">
    <span class="cart-icon"><img src="../assets/images/icons/4.png" alt=""></span>
    <span class="cart-text" data-lang-key="cart_selected">Selected:</span>
    <span class="cart-count" id="cartCount">0</span>
    <span class="cart-divider">|</span>
    <span class="cart-total" id="cartTotal">0</span>
    <span class="cart-currency">TON</span>
</a>

<script src="../js/main.js"></script>
<script src="../js/language.js"></script>
<script src="../js/TON.js"></script>
<script src="../js/api.js"></script>

<script>
  let allProducts = [];
  let selectedProducts = new Set();

  async function fetchAndRenderProducts() {
    try {
      const response = await fetch('/api/products');
      const resData = await response.json();
      
      if (resData.success && Array.isArray(resData.data)) {
        allProducts = resData.data;
        displayProducts(allProducts);
        setupFilterEvents();
      }
    } catch (error) {
      console.error('خطا در دریافت لیست محصولات:', error);
    }
  }

  function displayProducts(products) {
    const grid = document.getElementById('productsGrid');
    if (!grid) return;
    grid.innerHTML = '';

    products.forEach(item => {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.setAttribute('data-id', item.id);
      card.setAttribute('data-category', item.category || 'gifts');

      // آدرس صحیح تصویر از دیتابیس
      const imageSrc = item.webp_path ? `/${item.webp_path}` : (item.svg_path ? `/${item.svg_path}` : '../assets/stickers/GiftShop_Farsi_AgAD-BwAAvQXsVA.webp');

      card.innerHTML = `
        <div class="product-preview">
          <img src="${imageSrc}" alt="${item.title}" onerror="this.src='../assets/stickers/GiftShop_Farsi_AgAD-BwAAvQXsVA.webp'">
        </div>
        <div class="product-info">
          <h3 class="product-title">${item.title}</h3>
          <span class="product-price">TON ${parseFloat(item.price || 4).toFixed(2)}</span>
        </div>
      `;

      card.addEventListener('click', () => toggleSelectProduct(item, card));
      grid.appendChild(card);
    });
  }

  function toggleSelectProduct(item, cardElement) {
    if (selectedProducts.has(item.id)) {
      selectedProducts.delete(item.id);
      cardElement.classList.remove('selected');
    } else {
      selectedProducts.add(item.id);
      cardElement.classList.add('selected');
    }
    updateCartUI();
  }

  function updateCartUI() {
    const countElem = document.getElementById('cartCount');
    const totalElem = document.getElementById('cartTotal');
    
    let totalTon = 0;
    allProducts.forEach(p => {
      if (selectedProducts.has(p.id)) {
        totalTon += parseFloat(p.price || 4);
      }
    });

    if (countElem) countElem.innerText = selectedProducts.size;
    if (totalElem) totalElem.innerText = totalTon.toFixed(2);
  }

  function setupFilterEvents() {
    const filterButtons = document.querySelectorAll('.filter-btn');
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const category = btn.getAttribute('data-filter');
        if (category === 'all') {
          displayProducts(allProducts);
        } else {
          const filtered = allProducts.filter(p => (p.category || '').toLowerCase() === category.toLowerCase());
          displayProducts(filtered);
        }
      });
    });
  }

  function proceedToNextPage(event) {
    if (event) event.preventDefault();

    let selectedIds = Array.from(selectedProducts);
    if (selectedIds.length === 0 && allProducts.length > 0) {
      selectedIds = [allProducts[0].id];
    } else if (selectedIds.length === 0) {
      selectedIds = [1];
    }

    localStorage.setItem('selectedStickers', JSON.stringify(selectedIds));
    window.location.href = 'customize.html';
  }

  document.addEventListener('DOMContentLoaded', fetchAndRenderProducts);
</script>
</body>
</html>
