<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang-key="page_title_auto">Automatic Order</title>
    
   
   
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/Automatic-order.css">
    <link rel="stylesheet" href="../css/store.css">
    <link rel="stylesheet" href="../css/fonts.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    

<!-- ============== هدر ============== -->
<header class="header">
    <div class="header-container">

        <!-- بخش چپ: زبان با منوی کشویی -->
        <div class="header-left">
            <div class="language-wrapper">
                <button class="language-btn" id="languageToggle">
                    <span id="currentLanguage">🇬🇧 English</span>
                    <span class="language-arrow">▼</span>
                </button>
                
                <!-- منوی کشویی زبان -->
                <div class="language-dropdown" id="languageDropdown">
                    <ul class="language-list">
                        <li class="language-item" data-lang="en" onclick="changeLanguage('en', '🇬🇧', 'English')">
                            <span class="lang-flag">🇬🇧</span>
                            <span class="lang-name">English</span>
                        </li>
                        <li class="language-item" data-lang="fa" onclick="changeLanguage('fa', '🇮🇷', 'فارسی')">
                            <span class="lang-flag">🇮🇷</span>
                            <span class="lang-name">فارسی</span>
                        </li>
                        <li class="language-item" data-lang="ru" onclick="changeLanguage('ru', '🇷🇺', 'Русский')">
                            <span class="lang-flag">🇷🇺</span>
                            <span class="lang-name">Русский</span>
                        </li>
                        <li class="language-item" data-lang="zh" onclick="changeLanguage('zh', '🇨🇳', '中文')">
                            <span class="lang-flag">🇨🇳</span>
                            <span class="lang-name">中文</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- بخش وسط: دکمه پروفایل -->
        <div class="header-center">
            <div class="profile-wrapper">
                <button class="profile-btn" id="profileToggle">
                    <img src="https://ui-avatars.com/api/?name=User&background=6C63FF&color=fff&size=40" alt="Profile" />
                </button>
                
                <!-- منوی کشویی -->
                <div class="dropdown-menu" id="profileDropdown">
                    
                    <div class="dropdown-header">
                        <img src="https://ui-avatars.com/api/?name=User&background=6C63FF&color=fff&size=50" alt="Profile" />
                        <div class="dropdown-user-info">
                            <span class="dropdown-username" data-lang-key="user_label">Dear User</span>
                            <span class="dropdown-email">user@example.com</span>
                        </div>
                    </div>
                    
                    <ul class="dropdown-list">
                        <a href="../html/User-information.html">
                            <li class="dropdown-item">
                                <img src="../assets/images/icons/1.png" alt="" class="img-icon">
                                <span class="dropdown-label" data-lang-key="user_info">User Information</span>
                            </li>
                        </a>
                        <a href="../html/shopping-cart.html">
                            <li class="dropdown-item">
                                <img src="../assets/images/icons/4.png" alt="" class="img-icon">
                                <span class="dropdown-label" data-lang-key="user_orders">User Orders</span>
                            </li>
                        </a>
                        <a href="../html/bonus.html">
                            <li class="dropdown-item">
                                <img src="../assets/images/icons/3.png" alt="" class="img-icon">
                                <span class="dropdown-label" data-lang-key="gifts_rewards">Gifts & Rewards</span>
                            </li>
                        </a>
                        <a href="#">
                            <li class="dropdown-divider"></li>
                        </a>
                        <a href="#">
                            <li class="dropdown-item logout" onclick="alert('Logging out')">
                                <span class="dropdown-icon">🚪</span>
                                <span class="dropdown-label" data-lang-key="logout">Logout</span>
                            </li>
                        </a>
                    </ul>
                </div>
            </div>
        </div>

        <!-- بخش راست: موجودی TON -->
        <a href="../html/TON.html">
            <div class="header-right">
                <div class="balance-box">
                    <span class="balance-currency">TON</span>
                    <span class="balance-amount">00</span>
                </div>
            </div>
        </a>

    </div>

    <!-- خط جداکننده زیر هدر -->
    <div class="header-divider"></div>
</header>


<!-- ===== سکشن ۱: فیلتر محصولات ===== -->
<section class="filter-section">
    <div class="filter-container">
        <button class="filter-btn active" data-filter="all" data-lang-key="filter_all">All</button>
        <button class="filter-btn" data-filter="special" data-lang-key="filter_special">Special</button>
        <button class="filter-btn" data-filter="gift" data-lang-key="filter_gift">Gifts</button>
        <button class="filter-btn" data-filter="flag" data-lang-key="filter_flag">Flag</button>
        <button class="filter-btn" data-filter="other" data-lang-key="filter_other">Other</button>
    </div>
</section>


<!-- ===== سکشن ۲: محصولات ===== -->
<section class="products-section">
    <div class="products-container">
        <!-- محصول ۱ -->
        <a href="#" class="product-card" data-product-id="1">
            <div class="product-image">
                <img src="" alt="Product name">
            </div>
            <div class="product-info">
                <h3 class="product-name" data-lang-key="product1_name">Product Name</h3>
                <span class="product-code">#1234</span>
                <div class="product-price-cart">
                    <span class="product-price">1,000 TON</span>
                    <button class="add-to-cart" data-lang-key="add_to_cart">🛒</button>
                </div>
            </div>
        </a>

        <!-- محصول ۲ -->
        <a href="#" class="product-card" data-product-id="2">
            <div class="product-image">
                <img src="" alt="Product name">
            </div>
            <div class="product-info">
                <h3 class="product-name" data-lang-key="product2_name">Product Name</h3>
                <span class="product-code">#5678</span>
                <div class="product-price-cart">
                    <span class="product-price">2,500 TON</span>
                    <button class="add-to-cart" data-lang-key="add_to_cart">🛒</button>
                </div>
            </div>
        </a>

        <!-- محصول ۳ -->
        <a href="#" class="product-card" data-product-id="3">
            <div class="product-image">
                <img src="product3.jpg" alt="Product name">
            </div>
            <div class="product-info">
                <h3 class="product-name" data-lang-key="product3_name">Product Name</h3>
                <span class="product-code">#9012</span>
                <div class="product-price-cart">
                    <span class="product-price">3,750 TON</span>
                    <button class="add-to-cart" data-lang-key="add_to_cart">🛒</button>
                </div>
            </div>
        </a>
    </div>
</section>


<!-- ===== مودال سبد خرید با گالری ===== -->
<div class="modal-overlay" id="productModal">
    <div class="modal-content">
        
        <!-- گالری تصاویر -->
        <div class="modal-gallery">
            <button class="gallery-nav prev" id="galleryPrev">❮</button>
            
            <div class="gallery-container">
                <img id="modalImage" src="" alt="Product image">
                
                <!-- دات‌های پایین تصویر -->
                <div class="gallery-dots" id="galleryDots"></div>
            </div>
            
            <button class="gallery-nav next" id="galleryNext">❯</button>
        </div>
        
        <!-- جزئیات محصول -->
        <div class="modal-details">
            <h2 id="modalName" data-lang-key="product_name">Product Name</h2>
            <span class="modal-code" id="modalCode">#1234</span>
            <div class="modal-price" id="modalPrice">1,000 TON</div>
        </div>
        
        <!-- دکمه‌های مودال -->
        <div class="modal-actions">
            <button class="modal-btn cancel" id="modalCancel" data-lang-key="cancel">Cancel</button>
            <button class="modal-btn add" id="modalAdd" data-lang-key="add_to_cart_modal">Add to Cart</button>
        </div>
    </div>
</div>


<!-- ============== ناوبری پایین صفحه (ثابت) ============== -->
<div class="nav-bottom">
    <div class="nav-container">
        
        <!-- دکمه نمونه کار -->
        <a href="https://t.me/Villain_Produce">
            <button class="nav-btn profile-nav" data-target="profile-section">
                <img src="../assets/images/icons/5.png" alt="" class="img-icon">
                <span class="nav-text" data-lang-key="portfolio">Portfolio</span>
            </button>
        </a>
        
        <!-- دکمه خانه -->
        <a href="./index.html">
            <button class="nav-btn home-nav" data-target="home-section">
                <img src="../assets/images/icons/2.png" alt="" class="img-icon">
                <span class="nav-text" data-lang-key="home">Home</span>
            </button>
        </a>
        
        <!-- دکمه هدایا -->
        <a href="../html/bonus.html">
            <button class="nav-btn gift-nav" data-target="gift-section">
                <img src="../assets/images/icons/3.png" alt="" class="img-icon">
                <span class="nav-text" data-lang-key="gifts">Gifts</span>
            </button>
        </a>

    </div>
</div>


<script src="../js/main.js"></script>
<script src="../js/filter.js"></script>
<script src="../js/language.js"></script>
<script src="../js/TON.js"></script>
<script src="../js/api.js"></script>
</body>
</html>
