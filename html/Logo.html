<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title id="pageTitle" data-lang-key="page_title_logo">طراحی لوگو</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- فونت رسمی و یکپارچه وزیرمتن -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="../css/Design-order/Thumbnail.css">
    <link rel="stylesheet" href="../css/fonts.css">
    <link rel="stylesheet" href="../css/Design-order.css" />

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            /* ایجاد فضای خالی استاندارد برای جلوگیری از همپوشانی با نوار ناوبری */
            padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px)) !important;
            overflow-x: hidden;
            background: radial-gradient(circle at 50% 10%, rgba(34, 158, 217, 0.12) 0%, transparent 60%), #070709;
            color: #fff;
            min-height: 100vh;
        }

        .thumbnail-options {
            max-width: 480px;
            margin: 0 auto;
            padding: 14px 16px 25px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .options-title {
            font-size: 1.1rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 2px;
        }

        .option-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .option-label {
            font-size: 0.82rem;
            font-weight: 700;
            color: #94a3b8;
        }

        .option-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .option-btn {
            flex: 1 1 calc(33.333% - 8px);
            min-width: 80px;
            padding: 9px 6px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 11px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .option-btn.active {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.35);
            box-shadow: 0 3px 14px rgba(2, 132, 199, 0.45);
        }

        .upload-area {
            background: rgba(20, 20, 24, 0.7);
            border: 1.5px dashed rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 14px 12px;
            text-align: center;
            cursor: pointer;
        }

        .telegram-note-badge {
            margin-top: 8px;
            background: rgba(34, 158, 217, 0.1);
            border: 1px solid rgba(34, 158, 217, 0.25);
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 0.73rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            line-height: 1.4;
        }

        .user-description {
            width: 100%;
            background: rgba(20, 20, 24, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            outline: none;
            min-height: 85px;
            resize: vertical;
        }

        .submit-telegram-btn {
            width: 100%;
            background: linear-gradient(135deg, #0088cc, #006699);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 136, 204, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 8px;
            transition: all 0.25s ease;
        }

        .submit-telegram-btn:active {
            transform: scale(0.97);
            filter: brightness(1.1);
        }

        @media (max-width: 380px) {
            .option-btn {
                flex: 1 1 calc(50% - 8px);
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

<!-- ============== هدر ============== -->
<header class="header">
    <div class="header-container">

        <!-- بخش چپ: زبان با منوی کشویی -->
        <div class="header-left">
            <div class="language-wrapper" style="position: relative;">
                <button class="language-btn" id="languageToggle" type="button">
                    <span id="currentLanguage">🇮🇷 فارسی</span>
                    <span class="language-arrow">▼</span>
                </button>
                
                <!-- منوی کشویی زبان -->
                <div class="language-dropdown" id="languageDropdown">
                    <ul class="language-list" style="list-style: none; margin: 0; padding: 0;">

                            <span class="lang-name">فارسی</span>
                        </li>
                        <li class="language-item" onclick="selectLang('en', '🇬🇧', 'English')">

                        <li class="language-item" onclick="selectLang('ru', '🇷🇺', 'Русский')">

                            <span class="lang-name">Русский</span>
                        </li>
                        <li class="language-item" onclick="selectLang('zh', '🇨🇳', '中文')">
                            <span class="lang-flag">🇨🇳</span>
                            <span class="lang-name">中文</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- بخش وسط: دکمه پروفایل -->
        <div class="header-center">
            <div class="profile-wrapper">
                <button class="profile-btn" id="profileToggle" type="button">
                    <img src="https://ui-avatars.com/api/?name=User&background=6C63FF&color=fff&size=40" alt="Profile" />
                </button>
                
                <div class="dropdown-menu" id="profileDropdown">
                    <div class="dropdown-header">
                        <img src="https://ui-avatars.com/api/?name=User&background=6C63FF&color=fff&size=50" alt="Profile" />
                        <div class="dropdown-user-info">
                            <span class="dropdown-username" data-lang-key="user_label">کاربر گرامی</span>
                            <span class="dropdown-email">user@example.com</span>
                        </div>
                    </div>
                    
                    <ul class="dropdown-list">
                        <a href="../html/User-information.html">
                            <li class="dropdown-item">
                                <img src="../assets/images/icons/1.png" alt="" class="img-icon">
                                <span class="dropdown-label" data-lang-key="user_info">اطلاعات کاربری</span>
                            </li>
                        </a>
                        <a href="../html/shopping-cart.html">
                            <li class="dropdown-item">
                                <img src="../assets/images/icons/4.png" alt="" class="img-icon">
                                <span class="dropdown-label" data-lang-key="user_orders">سفارشات من</span>
                            </li>
                        </a>
                        <a href="../html/bonus.html">
                            <li class="dropdown-item">
                                <img src="../assets/images/icons/3.png" alt="" class="img-icon">
                                <span class="dropdown-label" data-lang-key="gifts_rewards">جوایز و هدایا</span>
                            </li>
                        </a>
                        <a href="#">
                            <li class="dropdown-divider"></li>
                        </a>
                        <a href="#">
                            <li class="dropdown-item logout" onclick="alert('Logging out')">
                                <span class="dropdown-icon">🚪</span>
                                <span class="dropdown-label" data-lang-key="logout">خروج</span>
                            </li>
                        </a>
                    </ul>
                </div>
            </div>
        </div>

        <!-- بخش راست: موجودی TON -->
        <a href="../html/TON.html" style="text-decoration: none;">
            <div class="header-right">
                <div class="balance-box">
                    <span class="balance-currency">TON</span>

    <div class="header-divider"></div>
</header>


<!-- ===== بخش سفارش طراحی لوگو ===== -->
<div class="thumbnail-options">
    <h3 class="options-title" id="txtTitleSettings" data-lang-key="logo_settings">تنظیمات طراحی لوگو</h3>
    
    <!-- گزینه ۱: سبک لوگو -->
    <div class="option-group" data-group="style">
        <label class="option-label" id="txtLabelStyle" data-lang-key="logo_style">سبک لوگو:</label>
        <div class="option-buttons">
            <button class="option-btn" data-value="iconic" data-lang-key="style_iconic" type="button">آیکونیک (Iconic)</button>
            <button class="option-btn" data-value="typography" data-lang-key="style_typography" type="button">تایپوگرافی (Typography)</button>
            <button class="option-btn" data-value="minimal" data-lang-key="style_minimal" type="button">مینیمال (Minimal)</button>
            <button class="option-btn" data-value="3d" data-lang-key="style_3d_logo" type="button">سه بعدی (3D)</button>
            <button class="option-btn" data-value="mascot" data-lang-key="style_mascot" type="button">مسکات (Mascot)</button>
            <button class="option-btn" data-value="mixed" data-lang-key="style_mixed" type="button">ترکیبی (Mixed)</button>
            <button class="option-btn" data-value="luxury" data-lang-key="style_luxury" type="button">لوکس (Luxury)</button>
        </div>
    </div>

    <!-- گزینه ۲: نوع نوشته -->
    <div class="option-group" data-group="text_type">
        <label class="option-label" id="txtLabelTextType" data-lang-key="text_type">نوع نوشته:</label>
        <div class="option-buttons">
            <button class="option-btn" data-value="persian" data-lang-key="text_persian" type="button">فارسی</button>
            <button class="option-btn" data-value="english" data-lang-key="text_english" type="button">انگلیسی</button>
            <button class="option-btn" data-value="russian" data-lang-key="text_russian" type="button">روسی</button>
            <button class="option-btn" data-value="chinese" data-lang-key="text_chinese" type="button">چینی</button>
            <button class="option-btn" data-value="mixed" data-lang-key="text_mixed" type="button">ترکیبی</button>
        </div>
    </div>

    <!-- گزینه ۳: رنگ‌بندی -->
    <div class="option-group" data-group="color_scheme">
        <label class="option-label" id="txtLabelColor" data-lang-key="color_scheme">رنگ‌بندی:</label>
        <div class="option-buttons">
            <button class="option-btn" data-value="mono" data-lang-key="color_mono" type="button">تک رنگ (Monochrome)</button>
            <button class="option-btn" data-value="multi" data-lang-key="color_multi" type="button">چند رنگ (Multi Color)</button>
            <button class="option-btn" data-value="gradient" data-lang-key="color_gradient" type="button">گرادینت (Gradient)</button>
            <button class="option-btn" data-value="custom" data-lang-key="color_custom" type="button">دلخواه (Custom)</button>
        </div>
    </div>

    <!-- گزینه ۴: سایز لوگو -->
    <div class="option-group" data-group="size">
        <label class="option-label" id="txtLabelSize" data-lang-key="logo_size">سایز خروجی لوگو:</label>
        <div class="option-buttons">
            <button class="option-btn" data-value="small" data-lang-key="size_small" type="button">کوچک (Small)</button>
            <button class="option-btn" data-value="medium" data-lang-key="size_medium" type="button">متوسط (Medium)</button>
            <button class="option-btn" data-value="large" data-lang-key="size_large" type="button">بزرگ (Large)</button>
        </div>
    </div>

    <!-- گزینه ۵: سطح سفارش -->
    <div class="option-group" data-group="level">
        <label class="option-label" id="txtLabelLevel" data-lang-key="order_level">سطح سفارش:</label>
        <div class="option-buttons">
            <button class="option-btn" data-value="normal" data-price="15" data-lang-key="level_normal_logo" type="button">معمولی - 15 TON</button>
            <button class="option-btn" data-value="vip" data-price="35" data-lang-key="level_vip_logo" type="button">ویژه (VIP) - 35 TON</button>
            <button class="option-btn" data-value="pro" data-price="60" data-lang-key="level_pro_logo" type="button">حرفه‌ای (Pro) - 60 TON</button>
        </div>
    </div>

    <!-- بخش آپلود تصویر و راهنمای تلگرام -->
    <div class="option-group">
        <label class="option-label" id="txtLabelUpload" data-lang-key="upload_image">آپلود اتود، طرح یا فایل مرجع (اختیاری):</label>
        <div class="upload-area">
            <input type="file" id="imageUpload" accept="image/*" multiple style="display:none;">
            <label for="imageUpload" class="upload-label" style="cursor:pointer; display:block;">
                <span style="font-size: 1.6rem;">📁</span>
                <p id="txtUploadClick" data-lang-key="upload_click" style="font-size: 0.8rem; margin: 4px 0;">برای انتخاب فایل کلیک کنید</p>
            </label>
            <div id="fileList" class="file-list"></div>
        </div>
        
        <!-- پیام راهنما برای ارسال در تلگرام -->
        <div class="telegram-note-badge">
            <span>💬</span>
            <span id="txtTgUploadNote" data-lang-key="tg_upload_note">می‌توانید عکس‌ها و فایل‌های خود را مستقیماً در چت تلگرام نیز ارسال کنید.</span>
        </div>
    </div>

    <!-- بخش توضیحات کاربر -->
    <div class="option-group">
        <label class="option-label" id="txtLabelDesc" data-lang-key="additional_info">توضیحات تکمیلی:</label>
        <textarea id="userDesc" class="user-description" placeholder="نام برند، سبک مدنظر و توضیحات تکمیلی طراحی لوگو را بنویسید..." data-lang-key="logo_description_placeholder"></textarea>
    </div>

    <!-- دکمه اختصاصی ارسال سفارش در تلگرام -->
    <button class="submit-telegram-btn" id="btnSubmitOrder" type="button" onclick="submitToTelegramDirect()">
        <span id="txtSubmitOrder" data-lang-key="submit_logo_tg">ارسال سفارش در چت تلگرام</span>
    </button>
</div>


<!-- ============== ناوبری پایین صفحه (ثابت) ============== -->

        </a>
        
        <!-- دکمه هدایا -->
        <a href="../html/bonus.html">
            <button class="nav-btn gift-nav" data-target="gift-section" type="button">

                <span class="nav-text" data-lang-key="gifts">هدایا</span>
            </button>
        </a>

    </div>
</div>

    function selectLang(lang, flag, name) {
        if (!i18nDictionary[lang]) lang = 'fa';
        currentLang = lang;
        const dict = i18nDictionary[lang];

        document.documentElement.dir = dict.dir;
        document.documentElement.lang = lang;

        const currentLangEl = document.getElementById('currentLanguage');
        if (currentLangEl) currentLangEl.innerText = `${flag} ${name}`;

        const dropdown = document.getElementById('languageDropdown');
        if (dropdown) dropdown.classList.remove('show');

        // به‌روزرسانی تمام متون بر اساس کلید
        document.querySelectorAll('[data-lang-key]').forEach(el => {
            const key = el.getAttribute('data-lang-key');
            if (dict[key]) {
                if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                    el.placeholder = dict[key];
                } else {
                    el.innerText = dict[key];
                }
            }
        });

        localStorage.setItem('selectedAppLanguage', lang);
    }

    // باز و بسته شدن دراپ‌داون زبان
    const langToggle = document.getElementById('languageToggle');
    const langDropdown = document.getElementById('languageDropdown');
    if (langToggle && langDropdown) {
        langToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            langDropdown.classList.toggle('show');
        });
        document.addEventListener('click', () => {
            langDropdown.classList.remove('show');
        });
    }

    // باز و بسته شدن منوی پروفایل
    const profileToggle = document.getElementById('profileToggle');
    const profileDropdown = document.getElementById('profileDropdown');
    if (profileToggle && profileDropdown) {
        profileToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            profileDropdown.classList.toggle('show');
        });
        document.addEventListener('click', () => {
            profileDropdown.classList.remove('show');
        });
    }

    // انتخاب دکمه‌های گزینه‌ها
    document.querySelectorAll('.option-group').forEach(group => {
        const btns = group.querySelectorAll('.option-btn');
        btns.forEach(btn => {
            btn.addEventListener('click', () => {
                btns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });
    });

    // نمایش نام فایل‌های انتخاب شده
    const imageUpload = document.getElementById('imageUpload');
    const fileList = document.getElementById('fileList');
    if (imageUpload) {
        imageUpload.addEventListener('change', (e) => {
            fileList.innerHTML = '';
            Array.from(e.target.files).forEach(file => {
                const item = document.createElement('div');
                item.style.fontSize = '0.75rem';
                item.style.color = '#38bdf8';
                item.style.marginTop = '4px';
                item.innerText = `📄 ${file.name}`;
                fileList.appendChild(item);
            });
        });
    }

    // ارسال سفارش به تلگرام به همان زبان انتخابی کاربر
    function submitToTelegramDirect() {
        const dict = i18nDictionary[currentLang] || i18nDictionary.fa;

        function getSelected(groupName) {
            const group = document.querySelector(`.option-group[data-group="${groupName}"]`);
            if (!group) return dict.not_selected;
            const active = group.querySelector('.option-btn.active');
            if (!active) return dict.not_selected;
            
            const key = active.getAttribute('data-lang-key');
            if (key && dict[key]) {
                return dict[key];
            }
            return active.innerText.trim();
        }

        const style = getSelected('style');
        const textType = getSelected('text_type');
        const colorScheme = getSelected('color_scheme');
        const size = getSelected('size');
        const level = getSelected('level');
        
        const description = document.getElementById('userDesc').value.trim() || dict.none;

        let filesText = dict.in_chat_sent;
        if (imageUpload && imageUpload.files && imageUpload.files.length > 0) {
            filesText = `${imageUpload.files.length} ${dict.files_unit}`;
        }

        // متن ساختاریافته سفارش لوگو
        const message = 
`${dict.tg_header}
──────────────────
${dict.tg_style} ${style}
${dict.tg_text_type} ${textType}
${dict.tg_color} ${colorScheme}
${dict.tg_size} ${size}
${dict.tg_level} ${level}
${dict.tg_files} ${filesText}
${dict.tg_desc} ${description}
──────────────────
${dict.tg_reminder_box}

${dict.tg_hashtags}`;

        const encodedMessage = encodeURIComponent(message);
        const targetUsername = "kianoush_shahrokh";
        const telegramUrl = `https://t.me/${targetUsername}?text=${encodedMessage}`;

        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
            window.Telegram.WebApp.openTelegramLink(telegramUrl);
        } else {
            window.open(telegramUrl, '_blank');
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
        
        const savedLang = localStorage.getItem('selectedAppLanguage') || 'fa';
        const flagMap = { fa: '🇮🇷', en: '🇬🇧', ru: '🇷🇺', zh: '🇨🇳' };
        const nameMap = { fa: 'فارسی', en: 'English', ru: 'Русский', zh: '中文' };
        selectLang(savedLang, flagMap[savedLang] || '🇮🇷', nameMap[savedLang] || 'فارسی');
    });
</script>
