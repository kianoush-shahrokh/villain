<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang-key="page_title_ton">Wallet - TON Connect</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/fonts.css">
    <link rel="stylesheet" href="../css/TON.css">

    <!-- کتابخانه رسمی TON Connect UI -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            background: #050505;
            color: #fff;
            margin: 0;
        }
        .ton-wallet-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: #111;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .connect-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        #ton-connect-button {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<!-- ============== هدر ============== -->
<header class="header">
    <div class="header-container">
        <div class="header-left">
            <div class="language-wrapper">
                <button class="language-btn" id="languageToggle">
                    <span id="currentLanguage">🇬🇧 English</span>
                    <span class="language-arrow">▼</span>
                </button>
            </div>
        </div>

        <div class="header-center">
            <div class="profile-wrapper">
                <button class="profile-btn" id="profileToggle">
                    <img src="https://ui-avatars.com/api/?name=User&background=6C63FF&color=fff&size=40" alt="Profile" />
                </button>
            </div>
        </div>

        <a href="../html/TON.html">
            <div class="header-right">
                <div class="balance-box">
                    <span class="balance-currency">TON</span>
                    <span class="balance-amount" id="header-balance">0.00</span>
                </div>
            </div>
        </a>
    </div>
    <div class="header-divider"></div>
</header>

<!-- ============== کانتینر اصلی ============== -->
<div class="ton-wallet-container">
    <div class="card">
        <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div class="card-title" style="font-weight: bold; font-size: 1.1rem;" data-lang-key="wallet_title">Wallet <span>TON Connect</span></div>
            <span class="badge" id="connection-status" style="background: #333; padding: 4px 10px; border-radius: 8px; font-size: 0.8rem; color: #aaa;">Disconnected</span>
        </div>

        <div class="connect-placeholder">
            <span class="icon" style="font-size: 3rem; margin-bottom: 10px;">💎</span>
            <p style="margin: 0 0 15px 0; color: #aaa; font-size: 0.9rem;" data-lang-key="connect_wallet_text">
                Connect your real TON wallet<br />
                <small style="color: #666;">To process payments and view assets securely</small>
            </p>
            
            <div id="ton-connect-button"></div>
        </div>

        <!-- اطلاعات کیف پول پس از اتصال -->
        <div class="connected-content" id="wallet-info-box" style="display:none; margin-top: 20px; border-top: 1px solid #222; padding-top: 15px;">
            <div class="wallet-address" style="display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 10px 15px; border-radius: 10px; margin-bottom: 15px;">
                <span class="addr" id="user-wallet-address" style="font-family: monospace; color: #aaa; font-size: 0.9rem;">---</span>
                <button class="copy-btn" onclick="copyAddress()" style="background: none; border: none; cursor: pointer; font-size: 1.1rem;" title="کپی آدرس">📋</button>
            </div>
            
            <div class="balance" id="user-wallet-balance" style="font-size: 1.5rem; font-weight: bold; color: #fff; margin-bottom: 10px;">0.00 <small style="font-size: 0.9rem; color: #e11d48;">TON</small></div>
            <div class="network-info" style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #888;">
                <span class="dot mainnet" style="background: #22c55e; width: 8px; height: 8px; border-radius: 50%;"></span>
                <span>TON Mainnet</span>
            </div>
        </div>
    </div>
</div>

<script src="../js/main.js"></script>
<script src="../js/language.js"></script>
<script src="../js/api.js"></script>

<!-- راه‌اندازی TON Connect با مانیفست اختصاصی سرور -->
<script>
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://villain-rexr.onrender.com/tonconnect-manifest.json',
        uiPreferences: {
            theme: 'DARK'
        },
        buttonRootId: 'ton-connect-button'
    });

    tonConnectUI.onStatusChange(walletInfo => {
        const statusBadge = document.getElementById('connection-status');
        const infoBox = document.getElementById('wallet-info-box');
        const addressText = document.getElementById('user-wallet-address');
        const headerBalance = document.getElementById('header-balance');

        if (walletInfo) {
            statusBadge.textContent = '🟢 Connected';
            statusBadge.style.background = '#065f46';
            statusBadge.style.color = '#34d399';
            infoBox.style.display = 'block';

            const rawAddress = walletInfo.account.address;
            const friendlyAddress = rawAddress.slice(0, 6) + '...' + rawAddress.slice(-4);
            addressText.textContent = friendlyAddress;
            
            localStorage.setItem('ton_wallet_connected', 'true');
            localStorage.setItem('ton_wallet_address', rawAddress);
            headerBalance.textContent = '0.00';
        } else {
            statusBadge.textContent = 'Disconnected';
            statusBadge.style.background = '#333';
            statusBadge.style.color = '#aaa';
            infoBox.style.display = 'none';

            localStorage.removeItem('ton_wallet_connected');
            localStorage.removeItem('ton_wallet_address');
            headerBalance.textContent = '0.00';
        }
    });

    function copyAddress() {
        const addr = localStorage.getItem('ton_wallet_address');
        if (addr) {
            navigator.clipboard.writeText(addr);
            alert('آدرس کیف پول کپی شد!');
        }
    }
</script>
</body>
</html>
