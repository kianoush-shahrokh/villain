<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang-key="page_title_cart">Shopping Cart</title>
    
    <script src="https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/build/player/lottie.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plasma:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Shoor+Rounded:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/fonts.css">
    <link rel="stylesheet" href="../css/shopping-cart.css">
    <style>
      .custom-cart-item { background: #1a1a1a; padding: 15px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; border: 1px solid #333; gap: 15px; }
      .cart-sticker-preview { width: 70px; height: 70px; background: #000; border-radius: 10px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; flex-shrink: 0; }
      .cart-sticker-preview svg { width: 50px; height: 50px; }
      .cart-item-details { flex-grow: 1; }
      .cart-item-details h4 { margin: 0 0 5px 0; color: #fff; font-size: 0.95rem; }
      .cart-item-details p { margin: 0; color: #aaa; font-size: 0.75rem; }
      .cart-item-right { display: flex; align-items: center; gap: 15px; }
      .cart-item-price { color: #e11d48; font-weight: bold; font-size: 0.95rem; white-space: nowrap; }
      .delete-btn { background: #222; border: 1px solid #444; color: #ff4d4d; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
      .delete-btn:hover { background: #ff4d4d; color: #fff; border-color: #ff4d4d; }
      .back-to-design { background: #222; color: #aaa; border: 1px solid #333; padding: 8px 12px; border-radius: 10px; font-size: 0.85rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; margin-bottom: 15px; transition: 0.2s; }
      .back-to-design:hover { border-color: #e11d48; color: #e11d48; }
    </style>
</head>
<body>

<!-- ============== هدر ============== -->
<header class="header">
    <div class="header-container">
        <div class="header-left">
            <div class="language-wrapper">
                <button class="language-btn" id="languageToggle">
                    <span id="currentLanguage">🇬🇧 English</span>
                    <span class="language-arrow">▼</span>
                </button>
                <div class="language-dropdown" id="languageDropdown">
                    <ul class="language-list">
                        <li class="language-item" data-lang="en" onclick="changeLanguage('en', '🇬🇧', 'English')"><span class="lang-flag">🇬🇧</span> <span class="lang-name">English</span></li>
                        <li class="language-item" data-lang="fa" onclick="changeLanguage('fa', '🇮🇷', 'فارسی')"><span class="lang-flag">🇮🇷</span> <span class="lang-name">فارسی</span></li>
                        <li class="language-item" data-lang="ru" onclick="changeLanguage('ru', '🇷🇺', 'Русский')"><span class="lang-flag">🇷🇺</span> <span class="lang-name">Русский</span></li>
                        <li class="language-item" data-lang="zh" onclick="changeLanguage('zh', '🇨🇳', '中文')"><span class="lang-flag">🇨🇳</span> <span class="lang-name">中文</span></li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="header-center">
            <div class="profile-wrapper">
                <button class="profile-btn" id="profileToggle">
                    <img src="https://ui-avatars.com/api/?name=User&background=6C63FF&color=fff&size=40" alt="Profile" />
                </button>
            </div>
        </div>

        <a href="../html/TON.html">
            <div class="header-right">
                <div class="balance-box">
                    <span class="balance-currency">TON</span>
                    <span class="balance-amount">00</span>
                </div>
            </div>
        </a>
    </div>
    <div class="header-divider"></div>
</header>

<!-- ============== محتوای اصلی سبد خرید ============== -->
<main>
    <div class="page-title" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h2 data-lang-key="cart_title">🛒 Shopping Cart</h2>
            <p class="subtitle" data-lang-key="cart_subtitle">View and manage your selected products</p>
        </div>
        <!-- دکمه بازگشت به صفحه کاستومایز -->
        <a href="customize.html" class="back-to-design">❮ ویرایش مجدد طرح</a>
    </div>

    <div class="cart-container">
        <div id="cart-items" class="cart-items">
            <!-- آیتم‌ها اینجا لود می‌شوند -->
        </div>

        <div class="cart-summary">
            <div>
                <span class="total-label" data-lang-key="total_label">Total:</span>
                <span class="total-amount" id="cart-total">0.00 <span>TON</span></span>
            </div>
            <button id="checkout-btn" class="checkout-btn" data-lang-key="checkout_btn">Checkout</button>
        </div>
    </div>
</main>

<!-- ============== ناوبری پایین صفحه ============== -->
<div class="nav-bottom">
    <div class="nav-container">
        <a href="https://t.me/Villain_Produce"><button class="nav-btn profile-nav"><img src="../assets/images/icons/5.png" alt="" class="img-icon"><span class="nav-text" data-lang-key="portfolio">Portfolio</span></button></a>
        <a href="./index.html"><button class="nav-btn home-nav"><img src="../assets/images/icons/2.png" alt="" class="img-icon"><span class="nav-text" data-lang-key="home">Home</span></button></a>
        <a href="../html/bonus.html"><button class="nav-btn gift-nav"><img src="../assets/images/icons/3.png" alt="" class="img-icon"><span class="nav-text" data-lang-key="gifts">Gifts</span></button></a>
    </div>
</div>

<script src="../js/main.js"></script>
<script src="../js/shapping.js"></script>
<script src="../js/language.js"></script>
<script src="../js/TON.js"></script>
<script src="../js/api.js"></script>

<script>
  async function loadCartCustomSticker() {
    const cartContainer = document.getElementById('cart-items');
    const totalElement = document.getElementById('cart-total');
    const savedDesign = JSON.parse(localStorage.getItem('finalCustomizedSticker'));

    if (!savedDesign) {
      cartContainer.innerHTML = '<p style="text-align:center; color:#777; padding: 20px;">سبد خرید شما خالی است.</p>';
      totalElement.innerHTML = `0.00 <span>TON</span>`;
      return;
    }

    try {
      // گرفتن محصولات از سرور برای استخراج قیمت و انیمیشن
      const res = await fetch('http://localhost:3001/api/products');
      const data = await res.json();
      const product = data.data.find(p => p.id == savedDesign.stickerId) || data.data[0];
      
      // فرض می‌کنیم قیمت در دیتابیس ستون price دارد، اگر نداشت پیش‌فرض 1.50 در نظر می‌گیریم
      const price = product.price ? parseFloat(product.price) : 1.50;

      const itemCard = document.createElement('div');
      itemCard.className = 'custom-cart-item';

      let textDesc = savedDesign.textData && savedDesign.textData.text ? `متن: ${savedDesign.textData.text}` : 'بدون متن سفارشی';

      itemCard.innerHTML = `
        <div class="cart-sticker-preview" id="cartLottiePreview"></div>
        <div class="cart-item-details">
          <h4>🎨 ${product.name || 'استیکر سفارشی'} (کد: ${savedDesign.dbId || 'ثبت شده'})</h4>
          <p>${textDesc}</p>
        </div>
        <div class="cart-item-right">
          <div class="cart-item-price">${price.toFixed(2)} TON</div>
          <button class="delete-btn" onclick="removeCartItem()" title="حذف محصول">🗑️</button>
        </div>
      `;
      
      cartContainer.innerHTML = '';
      cartContainer.appendChild(itemCard);
      totalElement.innerHTML = `${price.toFixed(2)} <span>TON</span>`;

      // رندر انیمیشن لاتی
      const anim = lottie.loadAnimation({
        container: document.getElementById('cartLottiePreview'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: product.json_path
      });

      // اعمال رنگ‌های سفارشی کاربر
      anim.addEventListener('DOMLoaded', () => {
        const svg = document.querySelector('#cartLottiePreview svg');
        if (svg && savedDesign.layers) {
          const groups = Array.from(svg.querySelectorAll(':scope > g > g'));
          Object.keys(savedDesign.layers).forEach(idx => {
            const color = savedDesign.layers[idx];
            if (groups[idx]) {
              groups[idx].querySelectorAll('path, rect, polygon').forEach(p => {
                p.setAttribute('fill', color);
                p.setAttribute('stroke', color);
              });
            }
          });
        }
      });

    } catch (err) {
      console.error('خطا در لود سبد خرید:', err);
      cartContainer.innerHTML = '<p style="text-align:center; color:#ff4d4d;">خطا در بارگذاری اطلاعات سبد خرید.</p>';
    }
  }

  // تابع حذف استیکر از سبد خرید
  function removeCartItem() {
    localStorage.removeItem('finalCustomizedSticker');
    loadCartCustomSticker(); // رفرش کردن ظاهر سبد خرید
  }

  document.addEventListener('DOMContentLoaded', loadCartCustomSticker);
</script>
</body>
</html>
