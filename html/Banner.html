<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang-key="page_title_design">Design Order</title>
    
    <!-- فونت‌های Google (یا اگر آفلاین داری، این بخش رو حذف کن) -->
    <link href="https://fonts.googleapis.com/css2?family=Plasma:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Shoor+Rounded:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="../css/Design-order/Thumbnail.css">
    <link rel="stylesheet" href="../css/fonts.css">
    <link rel="stylesheet" href="../css/Design-order.css" />
</head>
<body>
    

<!-- ============== هدر ============== -->
<header class="header">
    <div class="header-container">

        <!-- بخش چپ: زبان با منوی کشویی -->
        <div class="header-left">
            <div class="language-wrapper">
                <button class="language-btn" id="languageToggle">
                    <span id="currentLanguage">🇬🇧 English</span>
                    <span class="language-arrow">▼</span>
                </button>
                
                <!-- منوی کشویی زبان -->
                <div class="language-dropdown" id="languageDropdown">
                    <ul class="language-list">
                        <li class="language-item" data-lang="en" onclick="changeLanguage('en', '🇬🇧', 'English')">
                            <span class="lang-flag">🇬🇧</span>
                            <span class="lang-name">English</span>
                        </li>
                        <li class="language-item" data-lang="fa" onclick="changeLanguage('fa', '🇮🇷', 'فارسی')">
                            <span class="lang-flag">🇮🇷</span>
                            <span class="lang-name">فارسی</span>
                        </li>
                        <li class="language-item" data-lang="ru" onclick="changeLanguage('ru', '🇷🇺', 'Русский')">
                            <span class="lang-flag">🇷🇺</span>
                            <span class="lang-name">Русский</span>
                        </li>
                        <li class="language-item" data-lang="zh" onclick="changeLanguage('zh', '🇨🇳', '中文')">
                            <span class="lang-flag">🇨🇳</span>
                            <span class="lang-name">中文</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- بخش وسط: دکمه پروفایل -->
        <div class="header-center">
            <div class="profile-wrapper">
                <button class="profile-btn" id="profileToggle">
                    <img src="https://ui-avatars.com/api/?name=User&background=6C63FF&color=fff&size=40" alt="Profile" />
                </button>
                
                <!-- منوی کشویی -->
                <div class="dropdown-menu" id="profileDropdown">
                    
                    <div class="dropdown-header">
                        <img src="https://ui-avatars.com/api/?name=User&background=6C63FF&color=fff&size=50" alt="Profile" />
                        <div class="dropdown-user-info">
                            <span class="dropdown-username" data-lang-key="user_label">Dear User</span>
                            <span class="dropdown-email">user@example.com</span>
                        </div>
                    </div>
                    
                    <ul class="dropdown-list">
                        <a href="../html/User-information.html">
                            <li class="dropdown-item">
                                <img src="../assets/images/icons/1.png" alt="" class="img-icon">
                                <span class="dropdown-label" data-lang-key="user_info">User Information</span>
                            </li>
                        </a>
                        <a href="../html/shopping-cart.html">
                            <li class="dropdown-item">
                                <img src="../assets/images/icons/4.png" alt="" class="img-icon">
                                <span class="dropdown-label" data-lang-key="user_orders">User Orders</span>
                            </li>
                        </a>
                        <a href="../html/bonus.html">
                            <li class="dropdown-item">
                                <img src="../assets/images/icons/3.png" alt="" class="img-icon">
                                <span class="dropdown-label" data-lang-key="gifts_rewards">Gifts & Rewards</span>
                            </li>
                        </a>
                        <a href="#">
                            <li class="dropdown-divider"></li>
                        </a>
                        <a href="#">
                            <li class="dropdown-item logout" onclick="alert('Logging out')">
                                <span class="dropdown-icon">🚪</span>
                                <span class="dropdown-label" data-lang-key="logout">Logout</span>
                            </li>
                        </a>
                    </ul>
                </div>
            </div>
        </div>

        <!-- بخش راست: موجودی TON -->
        <a href="../html/TON.html">
            <div class="header-right">
                <div class="balance-box">
                    <span class="balance-currency">TON</span>
                    <span class="balance-amount">00</span>
                </div>
            </div>
        </a>

    </div>

    <!-- خط جداکننده زیر هدر -->
    <div class="header-divider"></div>
</header>


<!-- ===== بخش سفارش طراحی بنر ===== -->
<div class="thumbnail-options">
    <h3 class="options-title" data-lang-key="design_settings">Banner Design Settings</h3>
    
    <!-- گزینه ۱: پلتفرم بنر -->
    <div class="option-group">
        <label class="option-label" data-lang-key="banner_platform">Banner Platform:</label>
        <div class="option-buttons">
            <button class="option-btn" data-value="instagram" data-lang-key="platform_instagram">Instagram</button>
            <button class="option-btn" data-value="telegram" data-lang-key="platform_telegram">Telegram</button>
            <button class="option-btn" data-value="youtube" data-lang-key="platform_youtube">YouTube</button>
            <button class="option-btn" data-value="advertising" data-lang-key="platform_advertising">Advertising</button>
        </div>
    </div>

    <!-- گزینه ۲: نوع نوشته -->
    <div class="option-group">
        <label class="option-label" data-lang-key="text_type">Text Type:</label>
        <div class="option-buttons">
            <button class="option-btn" data-value="persian" data-lang-key="text_persian">Persian</button>
            <button class="option-btn" data-value="english" data-lang-key="text_english">English</button>
            <button class="option-btn" data-value="russian" data-lang-key="text_russian">Russian</button>
            <button class="option-btn" data-value="chinese" data-lang-key="text_chinese">Chinese</button>
            <button class="option-btn" data-value="mixed" data-lang-key="text_mixed">Mixed</button>
        </div>
    </div>

    <!-- گزینه ۳: سایز بنر -->
    <div class="option-group">
        <label class="option-label" data-lang-key="banner_size">Banner Size:</label>
        <div class="option-buttons">
            <button class="option-btn" data-value="small" data-lang-key="size_small">Small</button>
            <button class="option-btn" data-value="medium" data-lang-key="size_medium">Medium</button>
            <button class="option-btn" data-value="large" data-lang-key="size_large">Large</button>
            <button class="option-btn" data-value="custom" data-lang-key="size_custom">Custom</button>
        </div>
    </div>

    <!-- گزینه ۴: رنگ‌بندی -->
    <div class="option-group">
        <label class="option-label" data-lang-key="color_scheme">Color Scheme:</label>
        <div class="option-buttons">
            <button class="option-btn" data-value="warm" data-lang-key="color_warm">Warm</button>
            <button class="option-btn" data-value="cool" data-lang-key="color_cool">Cool</button>
            <button class="option-btn" data-value="neutral" data-lang-key="color_neutral">Neutral</button>
            <button class="option-btn" data-value="glamorous" data-lang-key="color_glamorous">Glamorous</button>
            <button class="option-btn" data-value="custom" data-lang-key="color_custom">Custom</button>
        </div>
    </div>

    <!-- گزینه ۵: سطح سفارش -->
    <div class="option-group">
        <label class="option-label" data-lang-key="order_level">Order Level:</label>
        <div class="option-buttons">
            <button class="option-btn" data-value="normal" data-price="12" data-lang-key="level_normal">Normal - 12 TON</button>
            <button class="option-btn" data-value="vip" data-price="30" data-lang-key="level_vip">VIP - 30 TON</button>
            <button class="option-btn" data-value="pro" data-price="55" data-lang-key="level_pro">Pro - 55 TON</button>
        </div>
    </div>

    <!-- بخش آپلود تصویر -->
    <div class="option-group">
        <label class="option-label" data-lang-key="upload_image">Upload Image or Icon (Optional):</label>
        <div class="upload-area">
            <input type="file" id="imageUpload" accept="image/*" multiple>
            <label for="imageUpload" class="upload-label">
                <span>📁</span>
                <p data-lang-key="upload_click">Click to upload or drag files</p>
            </label>
            <div id="fileList" class="file-list"></div>
        </div>
    </div>

    <!-- بخش توضیحات کاربر -->
    <div class="option-group">
        <label class="option-label" data-lang-key="additional_info">Additional Description:</label>
        <textarea class="user-description" placeholder="Write your banner design description..." data-lang-key="description_placeholder"></textarea>
    </div>

    <!-- بخش آیدی کاربر -->
    <div class="option-group">
        <label class="option-label" data-lang-key="telegram_id">Enter your Telegram ID:</label>
        <input type="text" class="user-id" placeholder="Example: @username or ID number" data-lang-key="telegram_placeholder">
    </div>

    <!-- دکمه ثبت سفارش -->
    <button class="submit-order" data-lang-key="submit_order">Submit Banner Design Order</button>
</div>


<!-- ============== ناوبری پایین صفحه (ثابت) ============== -->
<div class="nav-bottom">
    <div class="nav-container">
        
        <!-- دکمه نمونه کار -->
        <a href="https://t.me/Villain_Produce">
            <button class="nav-btn profile-nav" data-target="profile-section">
                <img src="../assets/images/icons/5.png" alt="" class="img-icon">
                <span class="nav-text" data-lang-key="portfolio">Portfolio</span>
            </button>
        </a>
        
        <!-- دکمه خانه -->
        <a href="./index.html">
            <button class="nav-btn home-nav" data-target="home-section">
                <img src="../assets/images/icons/2.png" alt="" class="img-icon">
                <span class="nav-text" data-lang-key="home">Home</span>
            </button>
        </a>
        
        <!-- دکمه هدایا -->
        <a href="../html/bonus.html">
            <button class="nav-btn gift-nav" data-target="gift-section">
                <img src="../assets/images/icons/3.png" alt="" class="img-icon">
                <span class="nav-text" data-lang-key="gifts">Gifts</span>
            </button>
        </a>

    </div>
</div>


<script src="../js/main.js"></script>
<script src="../js/DesignOrder.js"></script>
<script src="../js/language.js"></script>
<script src="../js/TON.js"></script>
<script src="../js/api.js"></script>
</body>
</html>
